[package]
name = "code-atlas"
version = "0.1.0"
edition = "2021"
description = "A terminal code editor with IntelliJ-style keys and an optional Vim mode"
license = "MIT"

[[bin]]
name = "catlas"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = "0.28"
ratatui = "0.29"
ropey = "1.6"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
